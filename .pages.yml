# Configuration de Pages CMS (https://pagescms.org)
# Connecte-toi sur app.pagescms.org avec ton compte GitHub, puis ouvre ce dépôt.
# Seules les personnes ayant accès en écriture au dépôt peuvent modifier le contenu.

media:
  input: public/assets
  output: /assets

content:
  - name: projets
    label: Projets
    type: collection
    path: src/content/projets
    filename: '{primary}.md'
    view:
      fields: [title, annee, brouillon]
      primary: title
      sort: [ordre, annee]
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: annee
        label: Année
        type: number
        required: true
      - name: resume
        label: Résumé (affiché sur le cartel)
        type: text
        required: true
      - name: image
        label: Image (mockup)
        type: image
        required: true
      - name: imageAlt
        label: Description de l'image (accessibilité)
        type: string
      - name: technologies
        label: Technologies
        type: string
        list: true
      - name: lien
        label: Lien vers le code (GitHub)
        type: string
      - name: ordre
        label: Ordre d'affichage (1 = en premier)
        type: number
        default: 99
      - name: brouillon
        label: Brouillon (caché sur le site)
        type: boolean
        default: false
      - name: body
        label: Description détaillée
        type: rich-text

  - name: citations
    label: Citations
    type: file
    path: src/data/citations.json
    fields:
      - name: citations
        label: Citations
        type: object
        list: true
        fields:
          - name: texte
            label: Citation
            type: text
            required: true
          - name: auteur
            label: Auteur
            type: string
            required: true
